<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Yangi talaba</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .form-container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        label { font-size: 14px; color: #555; font-weight: 600; }
        input[type="text"], input[type="email"], input[type="number"] { width: 100%; padding: 10px; margin: 8px 0 15px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; transition: border-color 0.3s; }
        input[type="text"]:focus, input[type="email"]:focus, input[type="number"]:focus { border-color: #007bff; outline: none; }
        .buttons { display: flex; gap: 10px; }
        input[type="submit"], input[type="reset"] { flex: 1; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px; color: white; transition: background-color 0.3s; }
        input[type="submit"] { background-color: #28a745; }
        input[type="submit"]:hover { background-color: #218838; }
        input[type="reset"] { background-color: #dc3545; }
        input[type="reset"]:hover { background-color: #c82333; }
    </style>
</head>
<body>
<div class="form-container">
    <h2>Talaba ma'lumotlari formasi</h2>
    <form th:action="@{/form}" th:object="${student}" method="post">
        <label>ID:</label>
        <input type="number" th:field="*{id}" required />

        <label>Familiya (Фамилия):</label>
        <input type="text" th:field="*{surname}" required />

        <label>Ism (Имя):</label>
        <input type="text" th:field="*{name}" required />

        <label>Sharif (Отчество):</label>
        <input type="text" th:field="*{patronymic}" required />

        <label>E-mail:</label>
        <input type="email" th:field="*{email}" required />

        <label>O'qishga kirgan yili (Masalan, 2020):</label>
        <input type="number" th:field="*{enrollmentYear}" required />

        <div class="buttons">
            <input type="submit" value="Yuborish" />
            <input type="reset" value="Tozalash" />
        </div>
    </form>
</div>
</body>
</html>
